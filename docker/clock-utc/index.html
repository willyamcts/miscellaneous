<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WS Dashboard</title>

<style>
body {
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card {
    background:#111827;
    padding:40px;
    border-radius:20px;
    min-width:320px;
    text-align:center;
}

.title {
    margin-bottom:10px;
    color:#60a5fa;
}

.time {
    font-size:40px;
    color:#00ff88;
    font-weight:bold;
}

/* FIX: agora aplica também na hora */
.offline {
    color:#ff0000 !important;
    font-weight:bold;
}

.status {
    margin-top:10px;
    color:#94a3b8;
}

hr {
    border: 1px solid #1f2937;
    margin: 20px 0;
}

.internet-title.offline {
    color:#ff0000;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

    <div class="title">LOCAL TIME</div>
    <div class="time" id="local">--:--:--</div>

    <hr>

    <div id="internetTitle" class="title">INTERNET TIME</div>
    <div class="time" id="api">--:--:--</div>

    <hr>

    <div class="status" id="status">CONNECTING...</div>

</div>

<script>
const ws = new WebSocket("ws://localhost:9001");

const internetTitle = document.getElementById("internetTitle");
const apiTime = document.getElementById("api");

ws.onmessage = (e) => {
    const d = JSON.parse(e.data);

    document.getElementById("local").innerText = d.local_time;

    apiTime.innerText = d.api_time || "--:--:--";

    document.getElementById("status").innerText =
        d.http_status + " | " + d.http_latency;

    // TITULO
    if (d.api_status === "OFFLINE") {
        internetTitle.classList.add("offline");
        internetTitle.innerText = "INTERNET TIME (OFFLINE)";
    } else {
        internetTitle.classList.remove("offline");
        internetTitle.innerText = "INTERNET TIME";
    }

    // HORA (AGORA CORRETO)
    if (d.api_status === "OFFLINE") {
        apiTime.classList.add("offline");
    } else {
        apiTime.classList.remove("offline");
    }
};

ws.onopen = () => {
    document.getElementById("status").innerText = "CONNECTED";
};

ws.onclose = () => {
    document.getElementById("status").innerText = "DISCONNECTED";
    internetTitle.classList.add("offline");
    apiTime.classList.add("offline");
};
</script>

</body>
</html>
